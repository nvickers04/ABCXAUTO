<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABCXAUTO — Autonomous Trading Dashboard</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel2: #1c2129; --border: #2d333b;
    --text: #e6edf3; --dim: #8b949e; --accent: #58a6ff; --green: #3fb950;
    --red: #f85149; --yellow: #d29922;
    font-size: 15px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 14px; padding: 10px 18px;
    background: var(--panel); border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 1.1rem; margin: 0; letter-spacing: 1px; }
  .badge {
    font-size: .72rem; padding: 2px 9px; border-radius: 999px;
    border: 1px solid var(--border); color: var(--dim);
  }
  .badge.ok { color: var(--green); border-color: var(--green); }
  .badge.bad { color: var(--red); border-color: var(--red); }
  .badge.live { color: #fff; background: var(--red); border-color: var(--red); font-weight: 700; }
  .spacer { flex: 1; }
  main { flex: 1; display: flex; min-height: 0; }

  #activitycol { flex: 1.15; display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--border); }
  #messages { flex: 1; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 92%; padding: 9px 13px; border-radius: 10px; line-height: 1.45; white-space: pre-wrap; word-wrap: break-word; }
  .msg.assistant { align-self: flex-start; background: var(--panel2); border: 1px solid var(--border); }
  .msg.inject { align-self: center; background: transparent; border: 1px dashed var(--border); color: var(--dim); font-size: .8rem; max-width: 100%; }
  .msg.tool { align-self: flex-start; color: var(--dim); font-size: .78rem; padding: 2px 13px; font-family: Consolas, monospace; }
  .msg.event { align-self: center; color: var(--yellow); font-size: .8rem; }
  .msg.error { align-self: center; color: var(--red); font-size: .85rem; }
  #typing { color: var(--dim); font-size: .75rem; padding: 8px 18px; border-top: 1px solid var(--border); background: var(--panel); }

  #datacol { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
  .card .label { font-size: .68rem; text-transform: uppercase; letter-spacing: .8px; color: var(--dim); }
  .card .value { font-size: 1.15rem; font-weight: 600; margin-top: 3px; }
  .pos { color: var(--green); } .neg { color: var(--red); }

  section h2 {
    font-size: .78rem; text-transform: uppercase; letter-spacing: 1px;
    color: var(--dim); margin: 0 0 8px; display: flex; align-items: center; gap: 8px;
  }
  table.data { width: 100%; border-collapse: collapse; font-size: .82rem; background: var(--panel); border-radius: 10px; overflow: hidden; }
  table.data th { text-align: left; color: var(--dim); font-weight: 500; font-size: .72rem; padding: 7px 10px; border-bottom: 1px solid var(--border); }
  table.data td { padding: 6px 10px; border-bottom: 1px solid #21262d; }
  table.data tr:last-child td { border-bottom: none; }
  .prot { font-size: .7rem; padding: 1px 7px; border-radius: 999px; }
  .prot.yes { color: var(--green); border: 1px solid var(--green); }
  .prot.no { color: #fff; background: var(--red); font-weight: 700; }
  .empty { color: var(--dim); font-size: .82rem; padding: 10px 4px; }
  #refreshbtn { font-size: .72rem; padding: 3px 10px; border: 1px solid var(--border); background: var(--panel2); color: var(--text); border-radius: 7px; cursor: pointer; }
  #lastupdate { font-size: .7rem; color: var(--dim); font-weight: 400; text-transform: none; letter-spacing: 0; }
</style>
</head>
<body>
<header>
  <h1>ABCXAUTO</h1>
  <span id="conn" class="badge">connecting…</span>
  <span id="mode" class="badge">—</span>
  <span id="account" class="badge">—</span>
  <span id="monitor" class="badge">monitor: —</span>
  <span id="scan" class="badge">scan: —</span>
  <div class="spacer"></div>
  <span id="model" class="badge">—</span>
</header>
<main>
  <div id="activitycol">
    <div id="messages"></div>
    <div id="typing">Autonomous agent — read-only activity feed</div>
  </div>
  <div id="datacol">
    <section>
      <div class="cards" id="accountcards"></div>
    </section>
    <section>
      <h2>Positions &amp; Protection
        <button id="refreshbtn" onclick="refresh()">refresh</button>
        <span id="lastupdate"></span>
      </h2>
      <div id="positions"></div>
    </section>
    <section>
      <h2>Open Orders</h2>
      <div id="orders"></div>
    </section>
  </div>
</main>
<script>
const messages = document.getElementById('messages');
let currentAssistant = null;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function addMsg(cls, text) {
  const m = el('div', 'msg ' + cls, text);
  messages.appendChild(m);
  messages.scrollTop = messages.scrollHeight;
  return m;
}
function fmt(v, digits = 2) {
  if (v === null || v === undefined || v === '' || isNaN(v)) return '—';
  return Number(v).toLocaleString('en-US', { minimumFractionDigits: digits, maximumFractionDigits: digits });
}
function pnlClass(v) { return v > 0 ? 'pos' : (v < 0 ? 'neg' : ''); }

let ws;
function connectWS() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.onmessage = (e) => handleEvent(JSON.parse(e.data));
  ws.onclose = () => setTimeout(connectWS, 2000);
}
function handleEvent(ev) {
  switch (ev.type) {
    case 'inject':
      currentAssistant = null;
      addMsg('inject', '[' + ev.source + '] ' + (ev.text.length > 400 ? ev.text.slice(0, 400) + ' …' : ev.text));
      break;
    case 'assistant_delta':
      if (!currentAssistant) currentAssistant = addMsg('assistant', '');
      currentAssistant.textContent += ev.text;
      messages.scrollTop = messages.scrollHeight;
      break;
    case 'assistant_done':
      currentAssistant = null;
      break;
    case 'tool_call':
      currentAssistant = null;
      addMsg('tool', '⚙ ' + ev.name + '(' + JSON.stringify(ev.args) + ')');
      break;
    case 'proposal':
      addMsg('event', 'Proposing #' + ev.proposal.id + ' ' + ev.proposal.strategy + ' — auto-executing…');
      break;
    case 'proposal_rejected':
      addMsg('event', 'Proposal rejected: ' + ev.error);
      break;
    case 'execution': {
      const ok = ev.result && !ev.result.error;
      addMsg(ok ? 'event' : 'error',
        (ok ? '✔ ' : '✖ ') + ev.proposal.strategy + ' #' + ev.proposal.id + ' auto-executed — ' +
        JSON.stringify(ev.result));
      refresh();
      break;
    }
    case 'snapshot':
      renderSnapshot(ev.snapshot);
      break;
    case 'busy':
      document.getElementById('typing').textContent = ev.busy
        ? 'Grok is working…'
        : 'Autonomous agent — read-only activity feed';
      break;
    case 'error':
      addMsg('error', ev.text);
      break;
  }
}

function renderSnapshot(s) {
  if (!s || !s.connected) return;
  document.getElementById('lastupdate').textContent =
    'updated ' + new Date(s.taken_at).toLocaleTimeString();

  const a = s.account || {};
  const cards = document.getElementById('accountcards');
  cards.innerHTML = '';
  const items = [
    ['Net Liq', a.netliquidation, false],
    ['Cash', a.totalcashvalue, false],
    ['Daily P&L', a.dailypnl, true],
    ['Unrealized', a.unrealizedpnl, true],
    ['Realized', a.realizedpnl, true],
  ];
  for (const [label, val, colored] of items) {
    const c = el('div', 'card');
    c.appendChild(el('div', 'label', label));
    const v = el('div', 'value' + (colored ? ' ' + pnlClass(val) : ''), '$' + fmt(val));
    c.appendChild(v);
    cards.appendChild(c);
  }

  const prot = (s.protection && s.protection.positions) || [];
  const posDiv = document.getElementById('positions');
  if (!prot.length) {
    posDiv.innerHTML = '<div class="empty">No positions.</div>';
  } else {
    let html = '<table class="data"><tr><th>Symbol</th><th>Qty</th><th>Avg Cost</th><th>Price</th><th>Unrl P&L</th><th>Stop</th><th>Target</th><th>Protection</th></tr>';
    for (const p of prot) {
      const stops = (p.stop_orders || []).map(o => '$' + fmt(o.aux_price) + ' (#' + o.order_id + ')').join('<br>') || '—';
      const targets = (p.target_orders || []).map(o => '$' + fmt(o.lmt_price) + ' (#' + o.order_id + ')').join('<br>') || '—';
      const badge = p.sec_type !== 'STK'
        ? '<span class="prot">option</span>'
        : (p.protected ? '<span class="prot yes">protected</span>' : '<span class="prot no">UNPROTECTED</span>');
      html += '<tr><td>' + p.symbol + '</td><td>' + p.quantity + '</td><td>$' + fmt(p.avg_cost) +
        '</td><td>$' + fmt(p.market_price) + '</td><td class="' + pnlClass(p.unrealized_pnl) + '">$' + fmt(p.unrealized_pnl) +
        '</td><td>' + stops + '</td><td>' + targets + '</td><td>' + badge + '</td></tr>';
    }
    posDiv.innerHTML = html + '</table>';
  }

  const orders = s.open_orders || [];
  const ordDiv = document.getElementById('orders');
  if (!orders.length) {
    ordDiv.innerHTML = '<div class="empty">No open orders.</div>';
  } else {
    let html = '<table class="data"><tr><th>ID</th><th>Symbol</th><th>Action</th><th>Qty</th><th>Type</th><th>Stop/Aux</th><th>Limit</th><th>Status</th></tr>';
    for (const o of orders) {
      html += '<tr><td>' + o.order_id + '</td><td>' + o.symbol + '</td><td>' + o.action + '</td><td>' + o.quantity +
        '</td><td>' + o.order_type + '</td><td>' + (o.aux_price != null ? '$' + fmt(o.aux_price) : (o.trail_percent ? o.trail_percent + '%' : '—')) +
        '</td><td>' + (o.lmt_price != null ? '$' + fmt(o.lmt_price) : '—') + '</td><td>' + o.status + '</td></tr>';
    }
    ordDiv.innerHTML = html + '</table>';
  }
}

async function refresh() {
  try {
    const r = await fetch('/api/refresh', { method: 'POST' });
    const data = await r.json();
    if (data.snapshot) renderSnapshot(data.snapshot);
  } catch (e) { /* server not ready */ }
}

async function loadState() {
  const r = await fetch('/api/state');
  const s = await r.json();
  const conn = document.getElementById('conn');
  conn.textContent = s.connected ? 'IBKR connected' : 'IBKR offline';
  conn.className = 'badge ' + (s.connected ? 'ok' : 'bad');
  const mode = document.getElementById('mode');
  mode.textContent = s.mode;
  mode.className = 'badge' + (s.mode === 'LIVE' ? ' live' : '');
  document.getElementById('account').textContent = s.account_id || 'no account';
  document.getElementById('model').textContent = s.model;
  const mon = document.getElementById('monitor');
  mon.textContent = 'monitor: ' + (s.monitor_running ? 'on' : 'off');
  mon.className = 'badge ' + (s.monitor_running ? 'ok' : '');
  const scan = document.getElementById('scan');
  scan.textContent = 'scan: ' + (s.scan_enabled ? 'on' : 'off');
  scan.className = 'badge ' + (s.scan_enabled ? 'ok' : '');
  if (s.snapshot && s.snapshot.connected) renderSnapshot(s.snapshot);
}

connectWS();
loadState();
refresh();
setInterval(loadState, 30000);
</script>
</body>
</html>
